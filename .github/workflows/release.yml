name: Release

# Publishing a release is deliberate: it runs only when a maintainer pushes a
# version tag, or starts it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to start without signing material. Discovering this halfway through a
  # build wastes twenty minutes; discovering it after publishing means clients
  # reject the update.
  preflight:
    name: Check signing material
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Tag '$tag' is not a vX.Y.Z version tag."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Require the updater signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            Write-Host "An unsigned release must never be published. Clients verify"
            Write-Host "the installer's signature against the public key committed in"
            Write-Host "src-tauri/tauri.conf.json, so an unsigned update is silently"
            Write-Host "rejected by every installed copy. Add the secret in the"
            Write-Host "repository settings before releasing. See RELEASING.md."
            exit 1
          }
          Write-Host "Signing key is present."

  release:
    name: Build and publish
    runs-on: windows-latest
    needs: preflight
    permissions:
      # Only this job needs to write, and only to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches the package version
        shell: pwsh
        run: |
          $tag = "${{ needs.preflight.outputs.tag }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # The crates inherit their version from [workspace.package], so read it
          # there rather than looking for a plain `version = ` in the crate.
          $cargo = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $cargo) {
            Write-Host "::error::Could not read the version from [workspace.package] in Cargo.toml."
            exit 1
          }
          Write-Host "tag=$tag package=$pkg tauri=$conf cargo=$cargo"
          if ($tag -ne $pkg -or $tag -ne $conf -or $tag -ne $cargo) {
            Write-Host "::error::Version mismatch. Bump package.json, src-tauri/tauri.conf.json, and [workspace.package] in Cargo.toml together."
            exit 1
          }

      - name: Full test suite
        run: cargo test --workspace

      - name: Build the helper
        run: cargo build --release -p eclink-helper

      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Verify the signature was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer was produced in target/release/bundle/nsis."
            exit 1
          }
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path $sig)) {
            Write-Error "The installer has no .sig file. It is NOT signed; refusing to publish."
            exit 1
          }
          if ((Get-Item $sig).Length -lt 50) {
            Write-Error "The .sig file looks empty. Refusing to publish."
            exit 1
          }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "Signature: $((Get-Item $sig).Length) bytes"

      - name: Assemble release assets
        shell: pwsh
        id: assets
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          $sig = Get-Content "$($installer.FullName).sig" -Raw
          $version = "${{ needs.preflight.outputs.tag }}".TrimStart("v")

          # The installer file name contains a space, which must be percent-encoded
          # in the download URL the updater fetches.
          $encoded = [uri]::EscapeDataString($installer.Name)

          # The updater manifest an installed copy fetches.
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes on GitHub."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/$encoded"
              }
            }
          }
          # Written without a BOM, which the updater's JSON parser rejects.
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "target/release/bundle/nsis/latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sig=$($installer.FullName).sig" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Eclink ${{ needs.preflight.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.sig }}
            target/release/bundle/nsis/latest.json
