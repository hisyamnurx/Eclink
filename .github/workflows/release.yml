name: Release

# Publishing a release is deliberate: it runs only when a maintainer pushes a
# version tag, or starts it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to start without signing material. Discovering this halfway through a
  # build wastes twenty minutes; discovering it after publishing means clients
  # reject the update.
  preflight:
    name: Check signing material
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Tag '$tag' is not a vX.Y.Z version tag."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Require the updater signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Error @"
TAURI_SIGNING_PRIVATE_KEY is not set.

An unsigned release must never be published: clients verify the installer's
signature against the public key committed in src-tauri/tauri.conf.json, so an
unsigned update is silently rejected by every installed copy. Add the secret to
the repository settings before releasing. See RELEASING.md.
"@
            exit 1
          }
          Write-Host "Signing key is present."

  release:
    name: Build and publish
    runs-on: windows-latest
    needs: preflight
    permissions:
      # Only this job needs to write, and only to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches the package version
        shell: pwsh
        run: |
          $tag = "${{ needs.preflight.outputs.tag }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          Write-Host "tag=$tag package=$pkg tauri=$conf cargo=$cargo"
          if ($tag -ne $pkg -or $tag -ne $conf -or $tag -ne $cargo) {
            Write-Error "Version mismatch. Bump package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml together."
            exit 1
          }

      - name: Full test suite
        run: cargo test --workspace

      - name: Build the helper
        run: cargo build --release -p eclyzer-bridge-helper

      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Verify the signature was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer was produced in target/release/bundle/nsis."
            exit 1
          }
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path $sig)) {
            Write-Error "The installer has no .sig file. It is NOT signed; refusing to publish."
            exit 1
          }
          if ((Get-Item $sig).Length -lt 50) {
            Write-Error "The .sig file looks empty. Refusing to publish."
            exit 1
          }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "Signature: $((Get-Item $sig).Length) bytes"

      - name: Assemble release assets
        shell: pwsh
        id: assets
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          $sig = Get-Content "$($installer.FullName).sig" -Raw
          $version = "${{ needs.preflight.outputs.tag }}".TrimStart("v")

          # The updater manifest an installed copy fetches.
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes on GitHub."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Set-Content "target/release/bundle/nsis/latest.json" -Encoding utf8NoBOM

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sig=$($installer.FullName).sig" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Eclyzer Bridge ${{ needs.preflight.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.sig }}
            target/release/bundle/nsis/latest.json
