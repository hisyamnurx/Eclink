[workspace]
members = ["src-tauri", "helper"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
# 1.85 rather than the 1.77 floor Tauri 2 alone would allow: the codebase uses
# `Option::is_none_or` (1.82), `is_unicast_link_local` (1.84), and the 2024
# edition's `unsafe` attribute requirements (1.85). Declaring the real minimum
# keeps `cargo clippy`'s MSRV lint meaningful instead of noisy.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hisyamnurx/Eclink"
authors = ["Eclink contributors"]
description = "Eclink - AI Provider Manager for Coding Agents."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` is REQUIRED, not incidental. Without it `serde_json::Map` is a
# BTreeMap, so every write to Claude Code's settings.json would reorder the
# user's keys alphabetically — a diff they never asked for, produced by a tool
# whose whole promise is that it edits their config losslessly. The feature
# switches Map to an insertion-ordered IndexMap. Test:
# config::json_patch::tests::key_order_is_preserved_across_a_mutation
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "fmt", "chrono"] }
tracing-appender = "0.2"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-native-roots",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
regex = "1"
url = "2"
tempfile = "3"

# Windows-only
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
