<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A strict Content Security Policy. The app loads no remote scripts, no
      remote styles, and no analytics; the only outbound connections are the
      provider calls and the GitHub update check, both made from Rust.

      This must stay byte-identical to `app.security.csp` in
      src-tauri/tauri.conf.json. Tauri injects the config value at runtime in a
      packaged build, while this tag governs `vite dev`; if the two drift, the
      policy that is actually enforced stops being the one anyone reviewed. The
      test at src/lib/csp.test.ts fails when they diverge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src ipc: http://ipc.localhost; script-src 'self'"
    />
    <title>Eclyzer Bridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
